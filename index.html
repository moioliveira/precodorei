<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Preço do Rei</title>
<style>
:root{--fundo:#f6f3ee;--cartao:#fff;--texto:#1d1b18;--suave:#6b655c;--destaque:#e4572e;--linha:#e6e0d6}
@media (prefers-color-scheme:dark){:root{--fundo:#16140f;--cartao:#211e18;--texto:#f2eee6;--suave:#a39c90;--destaque:#ff7a50;--linha:#332e26}}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{max-width:1100px;margin:0 auto;padding:28px 16px 8px}h1{margin:0 0 4px;font-size:26px}
header p{margin:0;color:var(--suave)}
.filtros{max-width:1100px;margin:0 auto;padding:12px 16px;display:flex;flex-wrap:wrap;gap:8px}
.filtros input{flex:1 1 220px;padding:10px 12px;border:1px solid var(--linha);border-radius:10px;background:var(--cartao);color:var(--texto);font:inherit}
.filtros button{padding:8px 12px;border:1px solid var(--linha);border-radius:999px;background:var(--cartao);color:var(--texto);cursor:pointer;font:inherit}
.filtros button.ativo{background:var(--destaque);border-color:var(--destaque);color:#fff}
main{max-width:1100px;margin:0 auto;padding:8px 16px 32px;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.c{background:var(--cartao);border:1px solid var(--linha);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.c img{width:100%;aspect-ratio:1;object-fit:cover;background:var(--linha)}
.c div{padding:10px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.c h2{font-size:14px;margin:0;font-weight:600;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.preco{font-size:19px;font-weight:700}.de{color:var(--suave);text-decoration:line-through;font-size:13px;margin-left:6px}
.meta{color:var(--suave);font-size:12px}
.c a{margin-top:auto;text-align:center;padding:9px;border-radius:10px;background:var(--destaque);color:#fff;text-decoration:none;font-weight:600}
footer{max-width:1100px;margin:0 auto;padding:0 16px 32px;color:var(--suave);font-size:12px}
</style></head><body>
<header><h1>Preço do Rei</h1><p>Ofertas selecionadas de Shopee, Mercado Livre e Amazon. Atualizado em 20/11/2026 21:14.</p></header>
<div class="filtros"><input id="q" placeholder="Buscar produto..." aria-label="Buscar produto"><span id="nichos"></span></div>
<main id="grade"></main>
<footer>Link de afiliado: posso ganhar comissão, sem custo extra para você. Preço sujeito a alteração.</footer>
<script>
const P=[];const lojas={shopee:"Shopee",mercadolivre:"Mercado Livre",amazon:"Amazon"};
const brl=v=>v==null?"":v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
let nicho="";const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function render(){const q=document.getElementById("q").value.toLowerCase();
document.getElementById("grade").innerHTML=P.filter(p=>(!nicho||p.nicho===nicho)&&p.nome.toLowerCase().includes(q)).map(p=>`
<article class="c">${p.imagem?`<img loading="lazy" src="${esc(p.imagem)}" alt="">`:""}<div>
<h2>${esc(p.nome)}</h2><span><span class="preco">${brl(p.preco)}</span>${p.preco_original?`<span class="de">${brl(p.preco_original)}</span>`:""}</span>
<span class="meta">${lojas[p.loja]||p.loja}${p.vendas?` · ${p.vendas.toLocaleString("pt-BR")} vendidos`:""}${p.nota?` · ★ ${p.nota.toFixed(1)}`:""}</span>
<a href="${esc(p.link_afiliado)}" target="_blank" rel="sponsored noopener">Ver oferta</a></div></article>`).join("")||`<p style="grid-column:1/-1;color:var(--suave)">As primeiras ofertas chegam em breve. Volte amanhã! 👑</p>`}
const ns=[...new Set(P.map(p=>p.nicho).filter(Boolean))];
document.getElementById("nichos").innerHTML=["",...ns].map(n=>`<button data-n="${esc(n)}" class="${n===""?"ativo":""}">${esc(n||"Todos")}</button>`).join(" ");
document.getElementById("nichos").onclick=e=>{const b=e.target.closest("button");if(!b)return;nicho=b.dataset.n;
document.querySelectorAll("#nichos button").forEach(x=>x.classList.toggle("ativo",x===b));render()};
document.getElementById("q").oninput=render;render();
</script></body></html>
